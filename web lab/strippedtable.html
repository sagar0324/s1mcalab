<!DOCTYPE html>
<html>
<head>
<title>Stripped Table Using CSS</title>

<style>
#myTable{
width:80%;
font-family:sans-serif;
border-collapse:collapse;
}
#myTable th{
padding:10px;
text-align:left;
background-color:#4CAF50;
color:white;
border:1px solid black;
}
#myTable td{
padding:10px;
border:1px solid black;
}
#myTable tr{
border:1px solid black;
}
#myTable tr:nth-child(even){
background-color:#f2f2f2;
}
#myTable tr:hover{
background-color:#ddd;
}
</style>
</head>
<body>

<h2>Student Details</h2>

<table id="myTable">
<tr>
<th>Name</th>
<th>Age</th>
<th>Course</th>
</tr>

<tr>
<td>Arun</td>
<td>20</td>
<td>BSc CS</td>
</tr>

<tr>
<td>Rahul</td>
<td>21</td>
<td>BCA</td>
</tr>

<tr>
<td>Meera</td>
<td>20</td>
<td>BSc CS</td>
</tr>

<tr>
<td>Anu</td>
<td>20</td>
<td>BCA</td>
</tr>
</table>

</body>
</html>
